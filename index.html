<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisión iPhone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Hoja de banco de técnico: una columna, etiqueta de inspección arriba, secciones con estado OK / Falla por ítem, resumen final */
:root {
  --paper: #f3f6f7;
  --sheet: #ffffff;
  --ink: #13212b;
  --muted: #5b6b76;
  --line: #d6dee3;
  --accent: #0b6f7a;
  --accent-soft: #dceff1;
  --ok: #1d7a3e;
  --ok-soft: #dcf1e3;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --warn: #8a5a00;
  --warn-soft: #f6ead0;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0d1519; --sheet: #142027; --ink: #e4ecef; --muted: #93a4ad; --line: #26363f;
    --accent: #5cc3cd; --accent-soft: #143a40;
    --ok: #6fd393; --ok-soft: #153523; --bad: #ff8a80; --bad-soft: #3d1a18; --warn: #f0c25c; --warn-soft: #3a2e12;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0d1519; --sheet: #142027; --ink: #e4ecef; --muted: #93a4ad; --line: #26363f;
  --accent: #5cc3cd; --accent-soft: #143a40;
  --ok: #6fd393; --ok-soft: #153523; --bad: #ff8a80; --bad-soft: #3d1a18; --warn: #f0c25c; --warn-soft: #3a2e12;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body);
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
.duo { display: grid; gap: 20px; align-items: start; }
@media (min-width: 980px) {
  .wrap { max-width: 1180px; }
  .duo { grid-template-columns: 1fr 1fr; }
  #sections { grid-template-columns: 1fr 1fr; align-items: start; }
  header p { max-width: 80ch; }
}
@media (min-width: 980px) and (max-width: 1180px) { .batt { grid-template-columns: 1fr; } }

/* Pie de página */
footer { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1.5px solid var(--ink); font-size: .9rem; }
footer .by { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
footer .by a { color: var(--ink); }
.wa { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wa a { font: 600 .85rem/1 var(--body); padding: 10px 14px; border-radius: 3px; background: var(--ok); color: var(--sheet); text-decoration: none; }
.wa a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: 2.6rem; text-transform: uppercase; }
h2 { font-size: 1.45rem; text-transform: uppercase; }
.eyebrow { font: 600 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.path { font-family: var(--mono); font-size: .8rem; color: var(--muted); }

header { display: grid; gap: 8px; }
header p { margin: 0; max-width: 62ch; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { font: 600 .8rem/1 var(--mono); letter-spacing: .06em; border: 0; background: transparent; color: var(--muted); padding: 10px 12px; cursor: pointer; min-width: 58px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"].ok { background: var(--ok); color: var(--sheet); }
.seg button[aria-pressed="true"].bad { background: var(--bad); color: var(--sheet); }
.seg button[aria-pressed="true"].lang { background: var(--ink); color: var(--sheet); }

/* Etiqueta de inspección */
.tag {
  background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px;
  display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 16px 18px; align-items: center;
}
.tag .stats { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stat b { display: block; font: 700 1.9rem/1 var(--display); }
.stat span { font: 500 .7rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); }
.verdict { font: 700 1.15rem/1 var(--display); text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; border-radius: 3px; border: 1.5px solid currentColor; text-align: center; }
.verdict.pending { color: var(--muted); }
.verdict.good { color: var(--ok); background: var(--ok-soft); }
.verdict.fail { color: var(--bad); background: var(--bad-soft); }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

/* Paneles */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: grid; gap: 12px; }
.panel label { font-weight: 600; }
input.big {
  font: 600 1.5rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink);
}
input.big:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }
.result { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 3px; background: var(--paper); }
.result span { display: block; }
.letter { font: 700 2.6rem/1 var(--mono); width: 64px; height: 64px; display: grid; place-items: center; border-radius: 3px; border: 2px solid currentColor; }
.letter.M { color: var(--ok); } .letter.F, .letter.N { color: var(--warn); } .letter.P { color: var(--accent); } .letter.X, .letter.D { color: var(--bad); }
.result strong { display: block; font-size: 1.05rem; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; font-size: .85rem; margin: 0; padding: 0; list-style: none; }
.legend b { font-family: var(--mono); color: var(--accent); margin-right: 6px; }

/* Apple: serial, modelo y fecha */
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.field { display: grid; gap: 6px; align-content: start; }
input.txt { font: 500 16px/1.3 var(--body); width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); }
input.txt.mono-in { font-family: var(--mono); letter-spacing: .05em; text-transform: uppercase; }
input.txt:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }

/* Bloque QR dentro de Pantalla */
.qr-block { display: grid; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--accent-soft); }
.qr-block p { margin: 0; font-size: .9rem; }

/* Batería */
.batt { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.unit { position: relative; }
.unit input { padding-right: 70px; }
.unit em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 600 .9rem var(--mono); font-style: normal; color: var(--muted); pointer-events: none; }
.gauge { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.gauge i { display: block; height: 100%; width: 0; transition: width .25s; }
.chip { display: inline-block; font: 600 .75rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 3px; }
.chip.ok { color: var(--ok); background: var(--ok-soft); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.none { color: var(--muted); background: var(--paper); }

/* Secciones */
section.block { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; }
#sections { display: grid; gap: 20px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.block-head .count { font: 600 .78rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
ul.items { list-style: none; margin: 0; padding: 0; }
li.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); align-items: center; }
li.item:last-child { border-bottom: 0; }
li.item[data-state="ok"] { background: linear-gradient(90deg, var(--ok-soft), transparent 70%); }
li.item[data-state="bad"] { background: linear-gradient(90deg, var(--bad-soft), transparent 70%); }
.item .t { font-weight: 600; }
.item .h { font-size: .87rem; color: var(--muted); margin-top: 2px; }
.item .tools { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { font: 600 .85rem/1 var(--body); padding: 10px 14px; border-radius: 3px; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--ink); cursor: pointer; }
.btn.solid { background: var(--accent); color: var(--sheet); }
.btn.ghost { border-color: var(--line); background: transparent; }
a.btn { text-decoration: none; display: inline-block; }
a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn.send-wa { border-color: var(--ok); background: var(--ok); color: var(--sheet); }

/* Código QR y modo prueba de pantalla */
.qr { justify-self: start; background: #fff; padding: 14px; border-radius: 4px; border: 1px solid var(--line); }
.qr img, .qr canvas { display: block; width: 220px; height: 220px; max-width: 100%; }
.tm-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 6px; }
.tm-row strong { font-size: 1.05rem; }
.tm-ask { display: grid; gap: 10px; padding: 14px; border-radius: 3px; background: var(--warn-soft); }
.tm-res.ok { color: var(--ok); font-weight: 600; } .tm-res.bad { color: var(--bad); font-weight: 600; }

/* Resumen */
.summary { border: 1.5px solid var(--ink); }
.sum-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.sum-head div span { display: block; font: 500 .7rem/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sum-head div b { font: 600 1rem/1.3 var(--mono); }
.sum-list { display: grid; gap: 14px; }
.sum-list h3 { margin: 0 0 4px; font: 600 .75rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sum-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.sum-list li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: baseline; }
.mk { font: 700 1rem/1 var(--mono); text-align: center; }
.mk.ok { color: var(--ok); } .mk.bad { color: var(--bad); } .mk.none { color: var(--muted); }
li.bad-row { color: var(--bad); font-weight: 600; }
.sum-verdict { font: 700 1.6rem/1.1 var(--display); text-transform: uppercase; padding-top: 12px; border-top: 1px dashed var(--line); }
.sum-verdict.good { color: var(--ok); } .sum-verdict.fail { color: var(--bad); } .sum-verdict.pending { color: var(--muted); }

textarea { width: 100%; min-height: 96px; font: 16px/1.45 var(--body); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); resize: vertical; }
#report { font-family: var(--mono); font-size: 12.5px; min-height: 180px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#toast { font-size: .85rem; color: var(--ok); }

/* Pruebas a pantalla completa */
.overlay { position: fixed; inset: 0; z-index: 50; touch-action: none; user-select: none; -webkit-user-select: none; }
#grid { display: grid; background: #000; }
#grid div { border: 1px solid #333; background: #b3261e; }
#grid div.on { background: #1d7a3e; }
.ov-info { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 51; background: rgba(0,0,0,.75); color: #fff; font: 600 13px/1.3 var(--mono); padding: 8px 12px; border-radius: 3px; display: flex; gap: 10px; align-items: center; }
.ov-info button { font: inherit; background: #fff; color: #000; border: 0; padding: 6px 10px; border-radius: 2px; cursor: pointer; }
#colors { display: grid; place-items: end center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
#colors span { font: 600 12px var(--mono); padding: 6px 10px; background: rgba(127,127,127,.5); color: #fff; border-radius: 2px; }

.seg button { min-height: 42px; }

/* Celular: etiqueta de progreso fija arriba, botones grandes a todo el ancho */
@media (max-width: 640px) {
  body { padding-block: 14px 48px; font-size: 16px; }
  .wrap { gap: 16px; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.3rem; }
  .result, .batt { grid-template-columns: 1fr; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .tag { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; padding: 10px 12px; gap: 8px 10px; box-shadow: 0 6px 14px -10px rgba(0,0,0,.4); }
  .tag .stats { gap: 14px; }
  .stat b { font-size: 1.35rem; }
  .stat span { font-size: .62rem; }
  .verdict { font-size: .95rem; padding: 8px 10px; }
  .panel { padding: 14px; }
  .block-head { padding: 14px 14px 8px; }
  li.item { grid-template-columns: 1fr; padding: 12px 14px; }
  li.item .seg { width: 100%; }
  li.item .seg button { flex: 1; min-height: 48px; font-size: .9rem; }
  .item .tools .btn { flex: 1; min-height: 44px; }
  .qr-block { padding: 14px; }
  .actions .btn { flex: 1 1 calc(50% - 10px); text-align: center; min-height: 46px; }
  footer { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .bar i, .gauge i { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <span class="eyebrow" data-i="eyebrow"></span>
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button class="lang" id="lang-es" aria-pressed="false">ES</button>
        <button class="lang" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 data-i="title"></h1>
    <p class="muted" data-i="intro"></p>
    <div><span class="chip ok" id="importNote" data-i="imported" hidden></span></div>
  </header>

  <div class="tag" aria-live="polite">
    <div class="stats">
      <div class="stat"><b id="sDone">0/0</b><span data-i="checked"></span></div>
      <div class="stat ok"><b id="sOk">0</b><span>OK</span></div>
      <div class="stat bad"><b id="sBad">0</b><span data-i="fails"></span></div>
    </div>
    <div id="verdict" class="verdict pending"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <section class="panel" aria-labelledby="appleH">
    <h2 id="appleH" data-i="apTitle"></h2>
    <div class="path" data-i="apPath"></div>
    <div><a class="btn solid" href="https://checkcoverage.apple.com" target="_blank" rel="noopener" data-i="apOpen"></a></div>
    <div class="fields">
      <div class="field"><label for="serial" data-i="apSerial"></label><input class="txt mono-in" id="serial" autocomplete="off" spellcheck="false"></div>
      <div class="field"><label for="fullModel" data-i="apModel"></label><input class="txt" id="fullModel" autocomplete="off"></div>
      <div class="field"><label for="buyDate" data-i="apDate"></label><input class="txt" id="buyDate" autocomplete="off"></div>
    </div>
    <div class="path" data-i="apHint"></div>
  </section>

  <div class="duo">
  <section class="panel" aria-labelledby="decH">
    <h2 id="decH" data-i="decTitle"></h2>
    <div class="path" data-i="decPath"></div>
    <label for="model" data-i="modelLabel"></label>
    <input class="big" id="model" autocomplete="off" spellcheck="false" placeholder="MQ9X3LL/A">
    <div class="result" id="result"></div>
    <ul class="legend" id="legend"></ul>
  </section>

  <section class="panel" aria-labelledby="batH">
    <h2 id="batH" data-i="batTitle"></h2>
    <div class="path" data-i="batPath"></div>
    <div class="batt">
      <div class="field">
        <label for="health" data-i="health"></label>
        <div class="unit"><input class="big" id="health" type="number" inputmode="numeric" min="1" max="100" placeholder="87"><em>%</em></div>
        <div class="gauge"><i id="hGauge"></i></div>
        <div><span class="chip none" id="hChip"></span></div>
      </div>
      <div class="field">
        <label for="cycles" data-i="cycles"></label>
        <div class="unit"><input class="big" id="cycles" type="number" inputmode="numeric" min="0" placeholder="312"><em data-i="cycUnit"></em></div>
        <div class="path" data-i="cycHint"></div>
        <div><span class="chip none" id="cChip"></span></div>
      </div>
    </div>
  </section>
  </div>

  <div id="sections"></div>

  <section class="panel" aria-labelledby="notesH">
    <h2 id="notesH" data-i="notesTitle"></h2>
    <label for="notes" class="muted" data-i="notesLabel"></label>
    <textarea id="notes"></textarea>
  </section>

  <section class="panel summary" aria-labelledby="sumH">
    <h2 id="sumH" data-i="sumTitle"></h2>
    <div class="sum-head" id="sumHead"></div>
    <div class="sum-list" id="sumList"></div>
    <div class="sum-verdict" id="sumVerdict"></div>
    <div class="actions">
      <button class="btn solid" id="share" data-i="share" hidden></button>
      <a class="btn send-wa" id="sendWa" target="_blank" rel="noopener" data-i="sendWa"></a>
      <a class="btn" id="sendMail" data-i="sendMail"></a>
      <button class="btn" id="copy" data-i="copy"></button>
      <button class="btn ghost" id="reset" data-i="reset"></button>
      <span id="toast" role="status"></span>
    </div>
    <textarea id="report" readonly aria-label="Reporte / Report"></textarea>
  </section>

  <footer>
    <div class="by"><span data-i="madeBy"></span> <a href="mailto:johannbarajas@gmail.com">johannbarajas@gmail.com</a></div>
    <div class="wa">
      <span data-i="custom"></span>
      <a id="waLink" href="https://wa.me/17183149761" target="_blank" rel="noopener">WhatsApp +1 718 314 9761</a>
    </div>
  </footer>
</div>

<div class="wrap" id="testMode" hidden>
  <header>
    <span class="eyebrow" data-i="tmEyebrow"></span>
    <h1 data-i="tmTitle"></h1>
    <p class="muted" data-i="tmIntro"></p>
  </header>
  <section class="panel">
    <div class="tm-row"><div><strong data-i="tmTouch"></strong><div class="tm-res" id="tmTouchRes"></div></div><button class="btn solid" id="tmTouchBtn" data-i="start"></button></div>
    <div class="tm-row"><div><strong data-i="tmPixels"></strong><div class="tm-res" id="tmPixRes"></div></div><button class="btn solid" id="tmPixBtn" data-i="start"></button></div>
    <div class="tm-ask" id="tmAsk" hidden>
      <strong data-i="tmAskQ"></strong>
      <div class="actions"><button class="btn send-wa" id="tmNo" data-i="tmNo"></button><button class="btn" id="tmYes" data-i="tmYes"></button></div>
    </div>
  </section>
  <section class="panel" id="tmDone" hidden>
    <h2 data-i="tmDoneTitle"></h2>
    <p class="muted" style="margin:0" data-i="tmDoneHint"></p>
    <div class="qr" id="tmQr"></div>
  </section>
</div>

<div class="overlay" id="grid" hidden></div>
<div class="ov-info" id="gridInfo" hidden><span id="gridCount">0 %</span><button id="gridExit" data-i="exit"></button></div>
<div class="overlay" id="colors" hidden><span id="colorName"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const UI = {
  es: {
    eyebrow: "Hoja de inspección · iPhone usado", title: "Revisión iPhone",
    intro: "Marca cada punto como OK o Falla. Abre esta página en el iPhone que revisas para hacer las pruebas de pantalla táctil y píxeles desde el mismo equipo. No se guarda nada: al terminar, envía el reporte por WhatsApp o correo, o cópialo.",

const LANG_KEY = "revision-iphone-lang";
const EMPTY = () => ({ s: {}, model: "", notes: "", health: "", cycles: "", serial: "", fullModel: "", buyDate: "" });
let st = Object.assign(EMPTY(), { lang: "es" });
try { const l = localStorage.getItem(LANG_KEY); if (l === "es" || l === "en") st.lang = l; } catch (e) {}
const save = () => { try { localStorage.setItem(LANG_KEY, st.lang); } catch (e) {} };

/* QR: el iPhone revisado abre ?modo=pantalla; al terminar muestra un QR con ?touch=..&pixels=.. */
const SITE = "https://johannbarajas.github.io/CHECK_PHONE/";
const BASE = location.hostname.endsWith("github.io") ? location.origin + location.pathname : SITE;
const params = new URLSearchParams(location.search);
const TEST_MODE = params.get("modo") === "pantalla";
if (params.get("lang") === "es" || params.get("lang") === "en") st.lang = params.get("lang");
let imported = false;
["touch", "pixels"].forEach(k => { const v = params.get(k); if (v === "ok" || v === "bad") { st.s[k] = v; imported = true; } });
function drawQr(el, text) {
  el.innerHTML = "";
  if (window.QRCode) new QRCode(el, { text, width: 440, height: 440, correctLevel: QRCode.CorrectLevel.M });
  else el.textContent = text;
  el.hidden = false;
}

const $ = id => document.getElementById(id);
const T = () => UI[st.lang];
const ALL = SECTIONS.flatMap(s => s.items);
const total = ALL.length;

function healthInfo() {
  const h = parseInt(st.health, 10), t = T();
  if (!h) return { cls: "none", label: t.hNone, h: 0 };
  if (h >= 90) return { cls: "ok", label: t.hExc, h };
  if (h >= 85) return { cls: "ok", label: t.hGood, h };
  if (h >= 80) return { cls: "warn", label: t.hFair, h };
  return { cls: "bad", label: t.hBad, h };
}
function cycleInfo() {
  const c = st.cycles === "" ? NaN : parseInt(st.cycles, 10), t = T();
  if (isNaN(c)) return { cls: "none", label: t.cNone };
  if (c <= 300) return { cls: "ok", label: t.cLow };
  if (c <= 600) return { cls: "warn", label: t.cMid };
  return { cls: "bad", label: t.cHigh };
}
function battText() {
  const hi = healthInfo(), ci = cycleInfo(), t = T();
  const parts = [];
  if (hi.h) parts.push(`${hi.h} % (${hi.label})`);
  if (ci.cls !== "none") parts.push(`${st.cycles} ${t.cycUnit} (${ci.label})`);
  return parts.join(" · ") || "—";
}

function renderSections() {
  const t = T(), L = st.lang;
  $("sections").innerHTML = SECTIONS.map(sec => `
    <section class="block" aria-labelledby="h-${sec.id}">
      <div class="block-head"><h2 id="h-${sec.id}">${sec[L]}</h2><span class="count" data-count="${sec.id}"></span></div>
      ${sec.id === "display" ? `<div class="qr-block">
        <strong>${t.qrTitle}</strong>
        <p class="muted">${t.qrIntro}</p>
        <div><button class="btn solid" id="qrBtn">${t.qrShow}</button></div>
        <div class="qr" id="qrBox" hidden></div>
      </div>` : ""}
      <ul class="items">${sec.items.map(it => `
        <li class="item" id="it-${it.k}">
          <div><div class="t">${it[L][0]}</div><div class="h">${it[L][1]}</div></div>
          <div class="seg" role="group" aria-label="${it[L][0]}">
            <button class="ok" data-k="${it.k}" data-v="ok" aria-pressed="false">OK</button>
            <button class="bad" data-k="${it.k}" data-v="bad" aria-pressed="false">${L === "es" ? "FALLA" : "FAIL"}</button>
          </div>
          ${it.tool ? `<div class="tools"><button class="btn" data-tool="${it.tool}">${t.start}</button></div>` : ""}
        </li>`).join("")}
      </ul>
    </section>`).join("");
}
$("sections").addEventListener("click", e => {
  if (e.target.closest("#qrBtn")) { drawQr($("qrBox"), `${BASE}?modo=pantalla&lang=${st.lang}`); return; }
  const tool = e.target.closest("button[data-tool]");
  if (tool) { tool.dataset.tool === "touch" ? startTouch() : startColors(); return; }
  const b = e.target.closest("button[data-k]");
  if (!b) return;
  const { k, v } = b.dataset;
  st.s[k] = st.s[k] === v ? undefined : v;
  save(); update();
});

function applyLang() {
  const t = T();
  document.documentElement.lang = st.lang;
  document.title = t.title;
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = t[el.dataset.i]; });
  $("lang-es").setAttribute("aria-pressed", String(st.lang === "es"));
  $("lang-en").setAttribute("aria-pressed", String(st.lang === "en"));
  $("notes").placeholder = t.notesPh;
  $("serial").placeholder = t.phSerial;
  $("fullModel").placeholder = t.phModel;
  $("buyDate").placeholder = t.phDate;
  $("waLink").href = "https://wa.me/17183149761?text=" + encodeURIComponent(t.waMsg);
  $("legend").innerHTML = Object.entries(t.legend).map(([k, v]) => `<li><b>${k}</b>${v}</li>`).join("");
  renderSections();
  decode(); battery(); update();
}
$("lang-es").onclick = () => { st.lang = "es"; save(); applyLang(); };
$("lang-en").onclick = () => { st.lang = "en"; save(); applyLang(); };

function decode() {
  const raw = st.model, r = $("result"), t = T();
  if (!raw) { r.innerHTML = `<div class="letter X">?</div><div><strong>${t.decEmpty[0]}</strong><span class="muted">${t.decEmpty[1]}</span></div>`; return; }
  const p = t.prefix[raw[0]];
  if (!p) { r.innerHTML = `<div class="letter X">${raw[0]}</div><div><strong>${t.decUnknown[0]}</strong><span class="muted">${t.decUnknown[1]}</span></div>`; return; }
  const reg = regionOf(raw);
  r.innerHTML = `<div class="letter ${LETTER_CLASS[raw[0]]}">${raw[0]}</div><div><strong>${p[0]}</strong><span class="muted">${p[1]}${reg ? ` ${t.region} ${reg}.` : ""}</span></div>`;
}
function regionOf(raw) {
  const k = Object.keys(REGION).sort((a, b) => b.length - a.length).find(s => raw.endsWith(s));
  return k ? `${k} (${REGION[k][st.lang === "es" ? 0 : 1]})` : "";
}

function battery() {
  const hi = healthInfo(), ci = cycleInfo();
  $("hChip").className = "chip " + hi.cls; $("hChip").textContent = hi.label;
  $("cChip").className = "chip " + ci.cls; $("cChip").textContent = ci.label;
  const g = $("hGauge");
  g.style.width = (hi.h || 0) + "%";
  g.style.background = `var(--${hi.cls === "none" ? "line" : hi.cls})`;
}

function update() {
  const t = T(), L = st.lang;
  let ok = 0, bad = 0;
  SECTIONS.forEach(sec => {
    let d = 0;
    sec.items.forEach(({ k }) => {
      const v = st.s[k], li = $("it-" + k);
      li.dataset.state = v || "";
      li.querySelectorAll("button[data-v]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
      if (v) d++; if (v === "ok") ok++; if (v === "bad") bad++;
    });
    document.querySelector(`[data-count="${sec.id}"]`).textContent = `${d}/${sec.items.length}`;
  });
  const done = ok + bad;
  $("sDone").textContent = `${done}/${total}`;
  $("sOk").textContent = ok;
  $("sBad").textContent = bad;
  $("bar").style.width = (done / total * 100) + "%";
  const v = $("verdict"), sv = $("sumVerdict");
  if (bad) { v.className = "verdict fail"; v.textContent = bad === 1 ? t.fail1 : t.failN(bad); sv.className = "sum-verdict fail"; sv.textContent = t.vFail(bad); }
  else if (done === total) { v.className = "verdict good"; v.textContent = t.approved; sv.className = "sum-verdict good"; sv.textContent = t.vGood; }
  else { v.className = "verdict pending"; v.textContent = t.pending; sv.className = "sum-verdict pending"; sv.textContent = t.vPending(total - done); }

  const p = st.model && t.prefix[st.model[0]];
  const head = [[t.sFull, st.fullModel || "—"], [t.sSerial, st.serial || "—"], [t.sDate, st.buyDate || "—"], [t.sModel, st.model || "—"], [t.sState, p ? `${st.model[0]} · ${p[0]}` : "—"], [t.sRegion, (st.model && regionOf(st.model)) || "—"], [t.sBatt, battText()]];
  $("sumHead").innerHTML = head.map(([a, b]) => `<div><span>${a}</span><b>${b}</b></div>`).join("");
  $("sumList").innerHTML = SECTIONS.map(sec => `<div><h3>${sec[L]}</h3><ul>${sec.items.map(it => {
    const s = st.s[it.k];
    return `<li class="${s === "bad" ? "bad-row" : ""}"><span class="mk ${s || "none"}">${s === "ok" ? "✓" : s === "bad" ? "✗" : "–"}</span><span>${it[L][0]}</span></li>`;
  }).join("")}</ul></div>`).join("");
  const rep = report();
  $("report").value = rep;
  $("sendWa").href = "https://wa.me/?text=" + encodeURIComponent(rep);
  $("sendMail").href = "mailto:?subject=" + encodeURIComponent(t.mailSubject + (st.model ? " " + st.model : "")) + "&body=" + encodeURIComponent(rep);
}

function report() {
  const t = T(), L = st.lang;
  const p = st.model && t.prefix[st.model[0]];
  const lines = [t.reportTitle];
  if (st.fullModel) lines.push(`${t.sFull}: ${st.fullModel}`);
  if (st.serial) lines.push(`${t.sSerial}: ${st.serial}`);
  if (st.buyDate) lines.push(`${t.sDate}: ${st.buyDate}`);
  lines.push(`${t.sModel}: ${st.model || "—"}`);
  if (p) lines.push(`${t.sState}: ${st.model[0]} · ${p[0]}`);
  const reg = st.model && regionOf(st.model);
  if (reg) lines.push(`${t.sRegion}: ${reg}`);
  lines.push(`${t.sBatt}: ${battText()}`);
  SECTIONS.forEach(sec => {
    lines.push("", sec[L].toUpperCase());
    sec.items.forEach(it => lines.push(`${st.s[it.k] === "ok" ? "✅" : st.s[it.k] === "bad" ? "❌" : "➖"} ${it[L][0]}`));
  });
  if (st.notes) lines.push("", `${t.notesR}: ${st.notes}`);
  lines.push("", $("sumVerdict").textContent);
  return lines.join("\n");
}

/* Prueba táctil */
function startTouch() {
  const g = $("grid");
  const cols = 8, rows = Math.max(12, Math.round(cols * innerHeight / innerWidth));
  g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  g.innerHTML = "<div></div>".repeat(cols * rows);
  g.hidden = false; $("gridInfo").hidden = false;
  const n = cols * rows; let on = 0;
  touchPct = 0;
  const hit = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (el && el.parentNode === g && !el.classList.contains("on")) {
      el.classList.add("on"); on++;
      touchPct = Math.floor(on / n * 100);
      $("gridCount").textContent = touchPct + " %";
      if (on === n) { st.s.touch = "ok"; save(); update(); setTimeout(stopTouch, 400); }
    }
  };
  g.onpointerdown = e => { g.setPointerCapture(e.pointerId); hit(e.clientX, e.clientY); };
  g.onpointermove = e => { if (e.buttons || e.pointerType === "touch") hit(e.clientX, e.clientY); };
  $("gridCount").textContent = "0 %";
}
let touchPct = 0;
function stopTouch() {
  $("grid").hidden = true; $("gridInfo").hidden = true; $("grid").innerHTML = "";
  if (TEST_MODE) { st.s.touch = touchPct === 100 ? "ok" : "bad"; update(); tmRefresh(); }
}
$("gridExit").onclick = stopTouch;

/* Prueba de colores */
const COLORS = ["#ff0000", "#00ff00", "#0000ff", "#ffffff", "#000000", "#808080"];
let ci = 0;
function startColors() { ci = 0; showColor(); $("colors").hidden = false; }
function showColor() { $("colors").style.background = COLORS[ci]; $("colorName").textContent = `${T().colors[ci]} · ${ci + 1}/${COLORS.length} · ${T().tap}`; }
$("colors").onclick = () => {
  ci++;
  if (ci < COLORS.length) { showColor(); return; }
  $("colors").hidden = true;
  if (TEST_MODE) $("tmAsk").hidden = false;
};

/* Modo prueba de pantalla (en el iPhone revisado) */
function tmRefresh() {
  const t = T(), tr = $("tmTouchRes"), pr = $("tmPixRes");
  tr.className = "tm-res " + (st.s.touch || "");
  tr.textContent = st.s.touch ? `${st.s.touch === "ok" ? "✓" : "✗"} ${touchPct} %` : t.tmPending;
  pr.className = "tm-res " + (st.s.pixels || "");
  pr.textContent = st.s.pixels === "ok" ? "✓ " + t.tmNo : st.s.pixels === "bad" ? "✗ " + t.tmYes : t.tmPending;
  if (st.s.touch && st.s.pixels) {
    $("tmDone").hidden = false;
    drawQr($("tmQr"), `${BASE}?touch=${st.s.touch}&pixels=${st.s.pixels}&lang=${st.lang}`);
  }
}
$("tmTouchBtn").onclick = startTouch;
$("tmPixBtn").onclick = () => { $("tmAsk").hidden = true; startColors(); };
$("tmNo").onclick = () => { st.s.pixels = "ok"; $("tmAsk").hidden = true; update(); tmRefresh(); };
$("tmYes").onclick = () => { st.s.pixels = "bad"; $("tmAsk").hidden = true; update(); tmRefresh(); };

/* Entradas */
$("model").oninput = e => { st.model = e.target.value.trim().toUpperCase(); save(); decode(); update(); };
$("notes").oninput = e => { st.notes = e.target.value; save(); update(); };
$("serial").oninput = e => { st.serial = e.target.value.trim().toUpperCase(); update(); };
$("fullModel").oninput = e => { st.fullModel = e.target.value.trim(); update(); };
$("buyDate").oninput = e => { st.buyDate = e.target.value.trim(); update(); };
const battInput = () => {
  st.health = $("health").value; st.cycles = $("cycles").value;
  const h = parseInt(st.health, 10);
  if (h) st.s.battery = h >= 80 ? "ok" : "bad";
  save(); battery(); update();
};
$("health").oninput = battInput;
$("cycles").oninput = battInput;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(report()); $("toast").textContent = T().copied; }
  catch (e) { $("report").select(); $("toast").textContent = T().copyFail; }
};
if (navigator.share) {
  $("share").hidden = false;
  $("share").onclick = async () => {
    try { await navigator.share({ title: T().mailSubject, text: report() }); } catch (e) {}
  };
}
let armed = false;
$("reset").onclick = () => {
  if (!armed) { armed = true; $("reset").textContent = T().resetConfirm; setTimeout(() => { armed = false; $("reset").textContent = T().reset; }, 3000); return; }
  st = Object.assign(EMPTY(), { lang: st.lang }); save();
  ["model", "notes", "health", "cycles", "serial", "fullModel", "buyDate"].forEach(id => $(id).value = "");
  $("importNote").hidden = true;
  armed = false; $("toast").textContent = "";
  applyLang();
};

$("model").value = st.model;
$("notes").value = st.notes;
$("health").value = st.health;
$("cycles").value = st.cycles;
if (TEST_MODE) { document.querySelector(".wrap").hidden = true; $("testMode").hidden = false; }
$("importNote").hidden = !imported;
applyLang();
if (TEST_MODE) tmRefresh();
</script>
</body>
</html>
