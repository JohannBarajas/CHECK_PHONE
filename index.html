<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Revisión iPhone</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Hoja de banco de técnico: pasos numerados en el orden de la revisión (lo decisivo primero), etiqueta de progreso fija, resumen final */
:root {
  --paper: #f3f6f7;
  --sheet: #ffffff;
  --ink: #13212b;
  --muted: #5b6b76;
  --line: #d6dee3;
  --accent: #0b6f7a;
  --accent-soft: #dceff1;
  --ok: #1d7a3e;
  --ok-soft: #dcf1e3;
  --bad: #b3261e;
  --bad-soft: #f8dedb;
  --warn: #8a5a00;
  --warn-soft: #f6ead0;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #0d1519; --sheet: #142027; --ink: #e4ecef; --muted: #93a4ad; --line: #26363f;
    --accent: #5cc3cd; --accent-soft: #143a40;
    --ok: #6fd393; --ok-soft: #153523; --bad: #ff8a80; --bad-soft: #3d1a18; --warn: #f0c25c; --warn-soft: #3a2e12;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #0d1519; --sheet: #142027; --ink: #e4ecef; --muted: #93a4ad; --line: #26363f;
  --accent: #5cc3cd; --accent-soft: #143a40;
  --ok: #6fd393; --ok-soft: #153523; --bad: #ff8a80; --bad-soft: #3d1a18; --warn: #f0c25c; --warn-soft: #3a2e12;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  margin: 0;
  background: var(--paper); color: var(--ink); font: 15px/1.5 var(--body);
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
.duo { display: grid; gap: 20px; align-items: start; }
#sections { display: grid; gap: 20px; align-items: start; }
@media (min-width: 980px) {
  .wrap { max-width: 1180px; }
  .duo, #sections { grid-template-columns: 1fr 1fr; }
  header p { max-width: 80ch; }
}

h1, h2 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; text-wrap: balance; margin: 0; line-height: 1.05; }
h1 { font-size: 2.6rem; text-transform: uppercase; }
h2 { font-size: 1.45rem; text-transform: uppercase; display: flex; gap: 10px; align-items: baseline; }
h2 .n { font: 600 .8rem/1 var(--mono); color: var(--sheet); background: var(--accent); padding: 5px 7px; border-radius: 3px; transform: translateY(-2px); }
.eyebrow { font: 600 .72rem/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.path { font-family: var(--mono); font-size: .8rem; color: var(--muted); }
p { margin: 0; }

header { display: grid; gap: 8px; }
header p { max-width: 62ch; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 3px; overflow: hidden; }
.seg button { font: 600 .8rem/1 var(--mono); letter-spacing: .06em; border: 0; background: transparent; color: var(--muted); padding: 10px 12px; cursor: pointer; min-width: 52px; min-height: 42px; }
.seg button + button { border-left: 1.5px solid var(--line); }
.seg button[aria-pressed="true"].ok { background: var(--ok); color: var(--sheet); }
.seg button[aria-pressed="true"].bad { background: var(--bad); color: var(--sheet); }
.seg button[aria-pressed="true"].lang { background: var(--ink); color: var(--sheet); }
.seg button[aria-pressed="true"].gA { background: var(--ok); color: var(--sheet); }
.seg button[aria-pressed="true"].gB { background: var(--warn); color: var(--sheet); }
.seg button[aria-pressed="true"].gC { background: var(--bad); color: var(--sheet); }

/* Etiqueta de progreso */
.tag {
  background: var(--sheet); border: 1.5px solid var(--ink); border-radius: 4px;
  display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 16px 18px; align-items: center;
}
.tag .stats { display: flex; gap: 18px; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.stat b { display: block; font: 700 1.9rem/1 var(--display); }
.stat span { font: 500 .7rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.stat.ok b { color: var(--ok); } .stat.bad b { color: var(--bad); }
.verdict { font: 700 1.15rem/1 var(--display); text-transform: uppercase; letter-spacing: .04em; padding: 10px 14px; border-radius: 3px; border: 1.5px solid currentColor; text-align: center; }
.verdict.pending { color: var(--muted); }
.verdict.good { color: var(--ok); background: var(--ok-soft); }
.verdict.fail { color: var(--bad); background: var(--bad-soft); }
.bar { grid-column: 1 / -1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }

/* Paneles */
.panel { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: grid; gap: 12px; align-content: start; }
.panel label, .field > .lbl { font-weight: 600; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
.field { display: grid; gap: 6px; align-content: start; }
input.txt { font: 500 16px/1.3 var(--body); width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); min-height: 48px; }
input.big {
  font: 600 1.5rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase;
  width: 100%; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink);
}
input:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sub { border-top: 1px dashed var(--line); padding-top: 12px; display: grid; gap: 10px; }

.result { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 12px; border-radius: 3px; background: var(--paper); }
.result span { display: block; }
.letter { font: 700 2.6rem/1 var(--mono); width: 64px; height: 64px; display: grid; place-items: center; border-radius: 3px; border: 2px solid currentColor; }
.letter.M { color: var(--ok); } .letter.F, .letter.N { color: var(--warn); } .letter.P { color: var(--accent); } .letter.X, .letter.D { color: var(--bad); }
.result strong { display: block; font-size: 1.05rem; }
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; font-size: .85rem; margin: 0; padding: 0; list-style: none; }
.legend b { font-family: var(--mono); color: var(--accent); margin-right: 6px; }

/* Pestañita de tiempo de uso */
.age-pop { position: relative; display: grid; gap: 4px; margin-top: 6px; padding: 12px 14px; border-radius: 4px; border: 1.5px solid currentColor; animation: pop-in .28s ease-out; }
.age-pop::before { content: ""; position: absolute; top: -8px; left: 22px; width: 12px; height: 12px; background: inherit; border-left: 1.5px solid currentColor; border-top: 1.5px solid currentColor; transform: rotate(45deg); }
.age-pop b { font: 700 1.7rem/1.05 var(--display); letter-spacing: .02em; }
.age-pop span { font-size: .88rem; color: var(--ink); }
.age-pop.ok, .sum-age.ok { color: var(--ok); background: var(--ok-soft); }
.age-pop.warn, .sum-age.warn { color: var(--warn); background: var(--warn-soft); }
.age-pop.bad, .sum-age.bad { color: var(--bad); background: var(--bad-soft); }
@keyframes pop-in { from { opacity: .3; transform: translateY(-6px) scale(.97); } to { opacity: 1; transform: none; } }

/* Batería */
.batt { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.unit { position: relative; }
.unit input { padding-right: 70px; }
.unit em { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font: 600 .9rem var(--mono); font-style: normal; color: var(--muted); pointer-events: none; }
.gauge { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.gauge i { display: block; height: 100%; width: 0; transition: width .25s; }
.chip { display: inline-block; font: 600 .75rem/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 9px; border-radius: 3px; }
.chip.ok { color: var(--ok); background: var(--ok-soft); }
.chip.warn { color: var(--warn); background: var(--warn-soft); }
.chip.bad { color: var(--bad); background: var(--bad-soft); }
.chip.none { color: var(--muted); background: var(--paper); }

/* Estado físico */
.grades { display: grid; gap: 10px; }
.grade-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.grade-row span { font-weight: 600; }

/* Secciones del checklist */
section.block { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; }
.block-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 18px 10px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.block-head .count { font: 600 .78rem/1 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
ul.items { list-style: none; margin: 0; padding: 0; }
li.item { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 12px 18px; border-bottom: 1px solid var(--line); align-items: center; }
li.item:last-child { border-bottom: 0; }
li.item[data-state="ok"] { background: linear-gradient(90deg, var(--ok-soft), transparent 70%); }
li.item[data-state="bad"] { background: linear-gradient(90deg, var(--bad-soft), transparent 70%); }
.item .t { font-weight: 600; }
.item .h { font-size: .87rem; color: var(--muted); margin-top: 2px; }
.item .tools { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tool-status { flex-basis: 100%; font: 600 .82rem/1.3 var(--mono); color: var(--accent); }
.tool-status:empty { display: none; }
.btn { font: 600 .85rem/1 var(--body); padding: 10px 14px; border-radius: 3px; border: 1.5px solid var(--accent); background: var(--accent-soft); color: var(--ink); cursor: pointer; min-height: 42px; }
.btn.solid { background: var(--accent); color: var(--sheet); }
.btn.ghost { border-color: var(--line); background: transparent; }
a.btn { text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.send-wa { border-color: var(--ok); background: var(--ok); color: var(--sheet); }
.qr-wrap { flex-basis: 100%; display: grid; gap: 10px; padding: 14px; border-radius: 3px; background: var(--accent-soft); }
.qr-wrap p { font-size: .9rem; }
.qr { justify-self: start; background: #fff; padding: 14px; border-radius: 4px; border: 1px solid var(--line); }
.qr img, .qr canvas { display: block; width: 220px; height: 220px; max-width: 100%; }

/* Resumen */
.summary { border: 1.5px solid var(--ink); }
.sum-age { font: 700 1.35rem/1.15 var(--display); letter-spacing: .02em; text-wrap: balance; padding: 12px 14px; border-radius: 3px; }
.sum-head { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--line); }
.sum-head div span { display: block; font: 500 .7rem/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sum-head div b { font: 600 1rem/1.3 var(--mono); }
.sum-list { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.sum-list h3 { margin: 0 0 4px; font: 600 .75rem/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.sum-list ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; }
.sum-list li { display: grid; grid-template-columns: 22px 1fr; gap: 6px; align-items: baseline; }
.mk { font: 700 1rem/1 var(--mono); text-align: center; }
.mk.ok { color: var(--ok); } .mk.bad { color: var(--bad); } .mk.none { color: var(--muted); }
li.bad-row { color: var(--bad); font-weight: 600; }
.sum-verdict { font: 700 1.6rem/1.1 var(--display); text-transform: uppercase; padding-top: 12px; border-top: 1px dashed var(--line); }
.sum-verdict.good { color: var(--ok); } .sum-verdict.fail { color: var(--bad); } .sum-verdict.pending { color: var(--muted); }

textarea { width: 100%; min-height: 96px; font: 16px/1.45 var(--body); padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 3px; background: var(--paper); color: var(--ink); resize: vertical; }
#report { font-family: var(--mono); font-size: 12.5px; min-height: 180px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
#toast { font-size: .85rem; color: var(--ok); }

/* Pie */
footer { display: flex; flex-wrap: wrap; gap: 10px 24px; justify-content: space-between; align-items: center; padding-top: 18px; border-top: 1.5px solid var(--ink); font-size: .9rem; }
footer .by { font-family: var(--mono); font-size: .82rem; color: var(--muted); }
footer .by a { color: var(--ink); }
.wa { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.wa a { font: 600 .85rem/1 var(--body); padding: 10px 14px; border-radius: 3px; background: var(--ok); color: var(--sheet); text-decoration: none; }

/* Modo prueba (celular del cliente) */
.tm-row { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding-block: 10px; border-bottom: 1px solid var(--line); }
.tm-row:last-child { border-bottom: 0; }
.tm-row strong { font-size: 1.05rem; }
.tm-row .tool-status, .tm-row a.btn { grid-column: 1 / -1; }
.tm-row a.btn { justify-self: start; }
.tm-res.ok { color: var(--ok); font-weight: 600; } .tm-res.bad { color: var(--bad); font-weight: 600; }
.tm-ask { display: grid; gap: 10px; padding: 14px; border-radius: 3px; background: var(--warn-soft); }

/* Modo cliente: preguntas guiadas */
.cq { display: grid; gap: 8px; padding-block: 12px; border-bottom: 1px solid var(--line); }
.cq:last-child { border-bottom: 0; }
.cq .q { font-weight: 600; font-size: 1.02rem; }
.cq .seg button { min-width: 72px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { font: 600 .85rem/1 var(--mono); padding: 10px 12px; min-height: 44px; border: 1.5px solid var(--line); border-radius: 3px; background: transparent; color: var(--ink); cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.seg button[aria-pressed="true"].yn { background: var(--ink); color: var(--sheet); }
.kv { display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center; }
.kv span { font-weight: 600; }
.kv b { font-family: var(--mono); word-break: break-all; }
.remote { background: var(--accent-soft); border-color: var(--accent); }

/* Pruebas a pantalla completa */
.overlay { position: fixed; inset: 0; z-index: 50; touch-action: none; user-select: none; -webkit-user-select: none; }
#grid { display: grid; background: #000; }
#grid div { border: 1px solid #333; background: #b3261e; }
#grid div.on { background: #1d7a3e; }
.ov-info { position: fixed; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 51; background: rgba(0,0,0,.75); color: #fff; font: 600 13px/1.3 var(--mono); padding: 8px 12px; border-radius: 3px; display: flex; gap: 10px; align-items: center; }
.ov-info button { font: inherit; background: #fff; color: #000; border: 0; padding: 6px 10px; border-radius: 2px; cursor: pointer; }
#colors { display: grid; place-items: end center; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); }
#colors span { font: 600 12px var(--mono); padding: 6px 10px; background: rgba(127,127,127,.5); color: #fff; border-radius: 2px; }

/* Celular: progreso fijo arriba, botones grandes a todo el ancho */
@media (max-width: 640px) {
  body { padding-block: 14px 48px; font-size: 16px; }
  .wrap { gap: 16px; }
  h1 { font-size: 2.1rem; }
  h2 { font-size: 1.3rem; }
  .result, .batt { grid-template-columns: 1fr; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
  .tag { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; padding: 10px 12px; gap: 8px 10px; box-shadow: 0 6px 14px -10px rgba(0,0,0,.4); }
  .tag .stats { gap: 14px; }
  .stat b { font-size: 1.35rem; }
  .stat span { font-size: .62rem; }
  .verdict { font-size: .95rem; padding: 8px 10px; }
  .panel { padding: 14px; }
  .block-head { padding: 14px 14px 8px; }
  li.item { grid-template-columns: 1fr; padding: 12px 14px; }
  li.item .seg { width: 100%; }
  li.item .seg button { flex: 1; min-height: 48px; font-size: .9rem; }
  .item .tools .btn { flex: 1 1 auto; min-height: 44px; }
  .grade-row .seg { width: 100%; }
  .grade-row .seg button { flex: 1; min-height: 46px; }
  .actions .btn { flex: 1 1 calc(50% - 10px); min-height: 46px; }
  footer { flex-direction: column; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) { .bar i, .gauge i { transition: none; } .age-pop { animation: none; } }
</style>
</head>
<body>

<div class="wrap" id="main">
  <header>
    <div class="top">
      <span class="eyebrow" data-i="eyebrow"></span>
      <div class="seg" role="group" aria-label="Idioma / Language">
        <button class="lang" id="lang-es" aria-pressed="false">ES</button>
        <button class="lang" id="lang-en" aria-pressed="false">EN</button>
      </div>
    </div>
    <h1 data-i="title"></h1>
    <p class="muted" data-i="intro"></p>
    <div><span class="chip ok" id="importNote" data-i="imported" hidden></span></div>
  </header>

  <div class="tag" aria-live="polite">
    <div class="stats">
      <div class="stat"><b id="sDone">0/0</b><span data-i="checked"></span></div>
      <div class="stat ok"><b id="sOk">0</b><span>OK</span></div>
      <div class="stat bad"><b id="sBad">0</b><span data-i="fails"></span></div>
    </div>
    <div id="verdict" class="verdict pending"></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <!-- Datos que mandó el cliente (solo al abrir un resultado) -->
  <section class="panel" id="clientData" hidden aria-labelledby="cdH">
    <h2 id="cdH" data-i="cdTitle"></h2>
    <p class="muted" data-i="cdHint"></p>
    <div class="kv" id="cdList"></div>
    <div class="actions">
      <a class="btn solid" href="https://checkcoverage.apple.com" target="_blank" rel="noopener" data-i="apOpen"></a>
      <a class="btn" href="https://www.stolenphonechecker.org/" target="_blank" rel="noopener" data-i="cdUs"></a>
      <a class="btn" href="https://www.imeicolombia.com.co/" target="_blank" rel="noopener" data-i="cdCo"></a>
    </div>
  </section>

  <!-- Revisión a distancia: el cliente se revisa solo y manda el resultado -->
  <section class="panel remote" aria-labelledby="remH">
    <h2 id="remH" data-i="remTitle"></h2>
    <p class="muted" data-i="remHint"></p>
    <div class="field"><label for="ownerWa" data-i="remWa"></label><input class="txt" id="ownerWa" inputmode="tel" autocomplete="tel" placeholder="17183149761"></div>
    <div class="actions">
      <a class="btn send-wa" id="remSend" target="_blank" rel="noopener" data-i="remSend"></a>
      <button class="btn solid" id="remQrBtn" data-i="remQr"></button>
    </div>
    <div class="qr" id="remQr" hidden></div>
  </section>

  <!-- Paso 1: bloqueos (lo que tumba una compra) -->
  <div id="sectionsTop"></div>

  <!-- Paso 2: modelo, fecha de compra y tipo de venta -->
  <section class="panel" aria-labelledby="appleH">
    <h2 id="appleH"><span class="n">2</span><span data-i="apTitle"></span></h2>
    <div class="path" data-i="apPath"></div>
    <div><a class="btn solid" href="https://checkcoverage.apple.com" target="_blank" rel="noopener" data-i="apOpen"></a></div>
    <div class="fields">
      <div class="field"><label for="fullModel" data-i="apModel"></label><input class="txt" id="fullModel" autocomplete="off"></div>
      <div class="field">
        <label for="buyDate" data-i="apDate"></label>
        <div class="seg" role="group" aria-label="Apple">
          <button class="lang" id="dtBuy" data-i="dtBuy" aria-pressed="true"></button>
          <button class="lang" id="dtWar" data-i="dtWar" aria-pressed="false"></button>
        </div>
        <input class="txt" id="buyDate" type="date">
        <div class="age-pop" id="agePop" role="status" hidden><b id="agePopBig"></b><span id="agePopSub"></span></div>
      </div>
    </div>
    <div class="path" data-i="apHint"></div>
    <div class="sub">
      <label for="model" data-i="modelLabel"></label>
      <div class="path" data-i="decPath"></div>

  if (bad) { v.className = "verdict fail"; v.textContent = bad === 1 ? t.fail1 : t.failN(bad); sv.className = "sum-verdict fail"; sv.textContent = t.vFail(bad); }
  else if (done === total) { v.className = "verdict good"; v.textContent = t.approved; sv.className = "sum-verdict good"; sv.textContent = t.vGood; }
  else { v.className = "verdict pending"; v.textContent = t.pending; sv.className = "sum-verdict pending"; sv.textContent = t.vPending(total - done); }

  const ai = ageInfo();
  $("agePop").hidden = !ai.big;
  $("agePop").className = "age-pop " + ai.cls;
  $("agePopBig").textContent = ai.big || "";
  $("agePopSub").textContent = ai.sub || "";
  $("sumAge").hidden = !ai.sentence;
  $("sumAge").className = "sum-age " + ai.cls; $("sumAge").textContent = ai.sentence || "";
  $("dtBuy").setAttribute("aria-pressed", String(st.dateKind === "buy"));
  $("dtWar").setAttribute("aria-pressed", String(st.dateKind === "war"));

  const p = st.model && t.prefix[st.model[0]];
  const head = [[t.sFull, st.fullModel || "—"], [t.sDate, ai.text || "—"], [t.sBatt, battText()], [t.sPhys, physText()],
    [t.sPrice, st.price || "—"], [t.sModel, st.model || "—"], [t.sState, p ? `${st.model[0]} · ${p[0]}` : "—"], [t.sRegion, (st.model && regionOf(st.model)) || "—"]];
  $("sumHead").innerHTML = head.map(([a, b]) => `<div><span>${a}</span><b></b></div>`).join("");
  $("sumHead").querySelectorAll("b").forEach((el, i) => { el.textContent = head[i][1]; });
  $("sumList").innerHTML = SECTIONS.map(sec => `<div><h3>${sec.n} · ${sec[L]}</h3><ul>${sec.items.map(it => {
    const s = st.s[it.k];
    return `<li class="${s === "bad" ? "bad-row" : ""}"><span class="mk ${s || "none"}">${s === "ok" ? "✓" : s === "bad" ? "✗" : "–"}</span><span>${it[L][0]}</span></li>`;
  }).join("")}</ul></div>`).join("");
  const rep = report();
  $("report").value = rep;
  $("sendWa").href = "https://wa.me/?text=" + encodeURIComponent(rep);
  $("sendMail").href = "mailto:?subject=" + encodeURIComponent(t.mailSubject + (st.fullModel ? " " + st.fullModel : "")) + "&body=" + encodeURIComponent(rep);
}

function report() {
  const t = T(), L = st.lang;
  const ai = ageInfo();
  const lines = [t.reportTitle];
  if (ai.sentence) lines.push(ai.sentence, "");
  if (st.fullModel) lines.push(`${t.sFull}: ${st.fullModel}`);
  if (ai.text) lines.push(`${t.sDate}: ${ai.text}`);
  lines.push(`${t.sBatt}: ${battText()}`);
  if (physText() !== "—") lines.push(`${t.sPhys}: ${physText()}`);
  const p = st.model && t.prefix[st.model[0]];
  if (st.model) lines.push(`${t.sModel}: ${st.model}`);
  if (p) lines.push(`${t.sState}: ${st.model[0]} · ${p[0]}`);
  const reg = st.model && regionOf(st.model);
  if (reg) lines.push(`${t.sRegion}: ${reg}`);
  if (st.price) lines.push(`${t.sPrice}: ${st.price}`);
  SECTIONS.forEach(sec => {
    lines.push("", `${sec.n}. ${sec[L].toUpperCase()}`);
    sec.items.forEach(it => lines.push(`${st.s[it.k] === "ok" ? "✅" : st.s[it.k] === "bad" ? "❌" : "➖"} ${it[L][0]}`));
  });
  if (st.notes) lines.push("", `${t.notesR}: ${st.notes}`);
  lines.push("", $("sumVerdict").textContent);
  return lines.join("\n");
}

/* Herramientas de prueba. onDone(k) se llama al terminar; en modo prueba pregunta el resultado. */
function status(k, text) {
  [$("ts-" + k), $("tms-" + k)].forEach(el => { if (el) el.textContent = text; });
}
function finished(k) {
  if (TEST_MODE) { if (k === "touch") { st.s.touch = touchPct === 100 ? "ok" : "bad"; renderTestMode(); } else askResult(k); }
  else if (k !== "touch") status(k, T().doneMark);
}
function runTool(k) {
  ({ touch: startTouch, pixels: startColors, speakers: playSpeaker, mic: testMic })[k]();
}

/* Táctil */
let touchPct = 0;
function startTouch() {
  const g = $("grid");
  const cols = 8, rows = Math.max(12, Math.round(cols * innerHeight / innerWidth));
  g.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  g.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  g.innerHTML = "<div></div>".repeat(cols * rows);
  g.hidden = false; $("gridInfo").hidden = false;
  const n = cols * rows; let on = 0;
  touchPct = 0;
  const hit = (x, y) => {
    const el = document.elementFromPoint(x, y);
    if (el && el.parentNode === g && !el.classList.contains("on")) {
      el.classList.add("on"); on++;
      touchPct = Math.floor(on / n * 100);
      $("gridCount").textContent = touchPct + " %";
      if (on === n) { st.s.touch = "ok"; update(); setTimeout(stopTouch, 400); }
    }
  };
  g.onpointerdown = e => { g.setPointerCapture(e.pointerId); hit(e.clientX, e.clientY); };
  g.onpointermove = e => { if (e.buttons || e.pointerType === "touch") hit(e.clientX, e.clientY); };
  $("gridCount").textContent = "0 %";
}
function stopTouch() {
  if ($("grid").hidden) return;
  $("grid").hidden = true; $("gridInfo").hidden = true; $("grid").innerHTML = "";
  finished("touch");
}
$("gridExit").onclick = stopTouch;

/* Colores */
const COLORS = ["#ff0000", "#00ff00", "#0000ff", "#ffffff", "#000000", "#808080"];
let ci = 0;
function startColors() { ci = 0; showColor(); $("colors").hidden = false; }
function showColor() { $("colors").style.background = COLORS[ci]; $("colorName").textContent = `${T().colors[ci]} · ${ci + 1}/${COLORS.length} · ${T().tap}`; }
$("colors").onclick = () => {
  ci++;
  if (ci < COLORS.length) { showColor(); return; }
  $("colors").hidden = true;
  finished("pixels");
};

/* Altavoces: barrido en estéreo, izquierda, derecha y bajos con Web Audio */
let actx = null, spkBusy = false;
function audio() {
  actx = actx || new (window.AudioContext || window.webkitAudioContext)();
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function playSpeaker() {
  if (spkBusy) return;
  spkBusy = true;
  const c = audio(), t0 = c.currentTime + .1, s = T().spk;
  const tone = (start, dur, pan, f1, f2) => {
    const o = c.createOscillator(), g = c.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(f1, start);
    o.frequency.exponentialRampToValueAtTime(f2, start + dur);
    g.gain.setValueAtTime(0, start);
    g.gain.linearRampToValueAtTime(.7, start + .05);
    g.gain.setValueAtTime(.7, start + dur - .08);
    g.gain.linearRampToValueAtTime(0, start + dur);
    o.connect(g);
    if (c.createStereoPanner) { const p = c.createStereoPanner(); p.pan.value = pan; g.connect(p); p.connect(c.destination); }
    else g.connect(c.destination);
    o.start(start); o.stop(start + dur);
  };
  const steps = [[0, 3, 0, 120, 4000], [3.3, 1.6, -1, 440, 440], [5.2, 1.6, 1, 660, 660], [7.1, 2, 0, 45, 110]];
  steps.forEach(a => tone(t0 + a[0], a[1], a[2], a[3], a[4]));
  status("speakers", s[0] + " " + T().spkHint);
  [3.3, 5.2, 7.1].forEach((at, i) => setTimeout(() => status("speakers", s[i + 1]), at * 1000));
  setTimeout(() => { spkBusy = false; status("speakers", s[4]); finished("speakers"); }, 9300);
}

/* Micrófono: graba 4 segundos y reproduce */
async function testMic() {
  const m = T().mic;
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
  catch (e) { status("mic", m.denied); return; }
  let rec;
  try { rec = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach(x => x.stop()); status("mic", m.denied); return; }
  const chunks = [];
  rec.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  rec.onstop = () => {
    stream.getTracks().forEach(x => x.stop());
    const a = new Audio(URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "audio/mp4" })));
    status("mic", m.play);
    a.onended = () => { status("mic", m.done); finished("mic"); };
    a.play().catch(() => { status("mic", m.done); finished("mic"); });
  };
  rec.start();
  status("mic", m.rec);
  setTimeout(() => rec.state !== "inactive" && rec.stop(), 4000);
}

/* Modo prueba en el celular del cliente */
let askKey = "";
function askResult(k) {
  askKey = k;
  $("tmAskQ").textContent = T().ask[k];
  $("tmYesOk").textContent = T().yesOk;
  $("tmNoBad").textContent = T().noBad;
  $("tmAsk").hidden = false;
}
$("tmYesOk").onclick = () => { st.s[askKey] = "ok"; $("tmAsk").hidden = true; renderTestMode(); };
$("tmNoBad").onclick = () => { st.s[askKey] = "bad"; $("tmAsk").hidden = true; renderTestMode(); };
function itemName(k) { for (const s of SECTIONS) for (const it of s.items) if (it.k === k) return it[st.lang][0]; return k; }
function renderTestMode() {
  const t = T();
  $("tmRows").innerHTML = NEEDED.map(k => {
    const v = st.s[k];
    const res = v ? `${v === "ok" ? "✓" : "✗"}${k === "touch" && touchPct ? " " + touchPct + " %" : ""}` : t.tmPending;
    return `<div class="tm-row">
      <div><strong>${itemName(k)}</strong><div class="tm-res ${v || ""}">${res}</div></div>
      <button class="btn solid" data-tm="${k}">${t.start}</button>
      <span class="tool-status" id="tms-${k}"></span>
      ${k === "speakers" ? `<a class="btn ghost" href="${YT}" target="_blank" rel="noopener">${t.yt}</a>` : ""}
    </div>`;
  }).join("");
  if (CLIENT_MODE) { clientRefresh(); return; }
  if (NEEDED.every(k => st.s[k])) {
    $("tmDone").hidden = false;
    drawQr($("tmQr"), `${BASE}?${NEEDED.map(k => `${k}=${st.s[k]}`).join("&")}&lang=${st.lang}`);
  }
}
$("tmRows").addEventListener("click", e => {
  const b = e.target.closest("button[data-tm]");
  if (b) { $("tmAsk").hidden = true; runTool(b.dataset.tm); }
});

/* Modo cliente: preguntas, resumen y envío */
function renderClient() {
  const t = T(), L = st.lang;
  $("cmQuestions").innerHTML = CLIENT_Q.map(q => {
    let ctl = "";
    if (q.type === "text") ctl = `<input class="txt" data-cq="${q.id}" autocomplete="off" spellcheck="false" ${q.num ? 'inputmode="numeric"' : ""} placeholder="${q.ph || ""}">`;
    if (q.type === "num") ctl = `<input class="txt" data-cq="${q.id}" type="number" inputmode="numeric" min="0" placeholder="${q.unit || ""}">`;
    if (q.type === "choice") ctl = `<div class="chips">${q.opts.map(o => `<button data-cq="${q.id}" data-a="${o}" aria-pressed="false">${o}</button>`).join("")}</div>`;
    if (q.type === "yn") ctl = `<div class="seg" role="group" aria-label="${q[L][0]}"><button class="yn" data-cq="${q.id}" data-a="yes" aria-pressed="false">${t.yes}</button><button class="yn" data-cq="${q.id}" data-a="no" aria-pressed="false">${t.no}</button></div>`;
    return `<div class="cq"><div class="q">${q[L][0]}</div><div class="path">${q[L][1]}</div>${ctl}</div>`;
  }).join("");
  $("cmQuestions").querySelectorAll("input[data-cq]").forEach(el => { el.value = cs[el.dataset.cq] || ""; });
  clientRefresh();
}
$("cmQuestions").addEventListener("input", e => {
  const el = e.target.closest("input[data-cq]");
  if (el) { cs[el.dataset.cq] = el.value.trim(); clientRefresh(); }
});
$("cmQuestions").addEventListener("click", e => {
  const b = e.target.closest("button[data-cq]");
  if (!b) return;
  const id = b.dataset.cq;
  cs[id] = cs[id] === b.dataset.a ? "" : b.dataset.a;
  clientRefresh();
});
function clientPayload() {
  const s = {};
  CLIENT_Q.filter(q => q.type === "yn" && cs[q.id]).forEach(q => q.keys.forEach(k => { s[k] = cs[q.id] === q.okIs ? "ok" : "bad"; }));
  TESTS.forEach(k => { if (st.s[k]) s[k] = st.s[k]; });
  return { m: cs.model || "", sn: cs.serial || "", im: cs.imei || "", sto: cs.storage || "", h: cs.health || "", c: cs.cycles || "", s };
}
function clientText(link) {
  const t = T(), p = clientPayload(), L = st.lang;
  const lines = [t.cmMsg.toUpperCase(), ""];
  if (p.m) lines.push(`${t.sModel}: ${p.m}`);
  if (p.sto) lines.push(`${t.cdStorage}: ${p.sto}`);
  if (p.h) lines.push(`${t.sBatt}: ${p.h} %${p.c ? ` · ${p.c} ${t.cycUnit}` : ""}`);
  lines.push("");
  CLIENT_Q.filter(q => q.type === "yn" && cs[q.id]).forEach(q => lines.push(`${cs[q.id] === q.okIs ? "✅" : "❌"} ${q[L][0]} ${cs[q.id] === "yes" ? t.yes : t.no}`));
  TESTS.forEach(k => { if (st.s[k]) lines.push(`${st.s[k] === "ok" ? "✅" : "❌"} ${itemName(k)}`); });
  lines.push("", t.cmOpen, link);
  return lines.join("\n");
}
function clientRefresh() {
  $("cmQuestions").querySelectorAll("button[data-cq]").forEach(b => b.setAttribute("aria-pressed", String(cs[b.dataset.cq] === b.dataset.a)));
  const link = `${BASE}?d=${b64e(clientPayload())}&lang=${st.lang}`;
  $("cmSendWa").href = `https://wa.me/${OWNER_WA}?text=${encodeURIComponent(clientText(link))}`;
  if (!$("cmQr").hidden) drawQr($("cmQr"), link);
}
$("cmQrBtn").onclick = () => {
  const box = $("cmQr");
  box.hidden = !box.hidden;
  if (!box.hidden) drawQr(box, `${BASE}?d=${b64e(clientPayload())}&lang=${st.lang}`);
};
if (navigator.share) {
  $("cmShare").hidden = false;
  $("cmShare").onclick = async () => {
    const link = `${BASE}?d=${b64e(clientPayload())}&lang=${st.lang}`;
    try { await navigator.share({ title: T().cmMsg, text: clientText(link) }); } catch (e) {}
  };
}

/* Revisión a distancia (en tu celular) y datos recibidos del cliente */
let ownerWa = "";
try { ownerWa = localStorage.getItem(OWNER_KEY) || ""; } catch (e) {}
$("ownerWa").value = ownerWa;
function clientLink() { return `${BASE}?modo=cliente&lang=${st.lang}${ownerWa ? `&wa=${ownerWa}` : ""}`; }
function remoteRefresh() {
  $("remSend").href = "https://wa.me/?text=" + encodeURIComponent(`${T().remMsg}\n${clientLink()}`);
  if (!$("remQr").hidden) drawQr($("remQr"), clientLink());
}
$("ownerWa").oninput = e => {
  ownerWa = e.target.value.replace(/\D/g, "").slice(0, 15);
  try { localStorage.setItem(OWNER_KEY, ownerWa); } catch (err) {}
  remoteRefresh();
};
$("remQrBtn").onclick = () => { $("remQr").hidden = !$("remQr").hidden; remoteRefresh(); };
function renderClientData() {
  if (!client) return;
  const t = T();
  const rows = [[t.cdSerial, client.sn], [t.cdImei, client.im], [t.cdStorage, client.sto]].filter(r => r[1]);
  $("cdList").innerHTML = rows.map((r, i) => `<span>${r[0]}</span><b data-v="${i}"></b>${i < 2 ? `<button class="btn ghost" data-copy="${i}">${t.copyBtn}</button>` : "<i></i>"}`).join("");
  $("cdList").querySelectorAll("b[data-v]").forEach(el => { el.textContent = rows[+el.dataset.v][1]; });
  $("cdList").onclick = async e => {
    const b = e.target.closest("button[data-copy]");
    if (!b) return;
    try { await navigator.clipboard.writeText(rows[+b.dataset.copy][1]); b.textContent = t.copiedBtn; } catch (err) {}
  };
  $("clientData").hidden = false;
}

/* Entradas */
$("model").oninput = e => { st.model = e.target.value.trim().toUpperCase(); decode(); update(); };
$("notes").oninput = e => { st.notes = e.target.value; update(); };
$("fullModel").oninput = e => { st.fullModel = e.target.value.trim(); update(); };
$("price").oninput = e => { st.price = e.target.value.trim(); update(); };
$("buyDate").oninput = $("buyDate").onchange = e => { st.buyDate = e.target.value; update(); };
$("dtBuy").onclick = () => { st.dateKind = "buy"; update(); };
$("dtWar").onclick = () => { st.dateKind = "war"; update(); };
const battInput = () => {
  st.health = $("health").value; st.cycles = $("cycles").value;
  const h = parseInt(st.health, 10);
  if (h) st.s.battery = h >= 80 ? "ok" : "bad";
  battery(); update();
};
$("health").oninput = battInput;
$("cycles").oninput = battInput;
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText(report()); $("toast").textContent = T().copied; }
  catch (e) { $("report").select(); $("toast").textContent = T().copyFail; }
};
if (navigator.share) {
  $("share").hidden = false;
  $("share").onclick = async () => {
    try { await navigator.share({ title: T().mailSubject, text: report() }); } catch (e) {}
  };
}
let armed = false;
$("reset").onclick = () => {
  if (!armed) { armed = true; $("reset").textContent = T().resetConfirm; setTimeout(() => { armed = false; $("reset").textContent = T().reset; }, 3000); return; }
  st = Object.assign(EMPTY(), { lang: st.lang });
  ["model", "notes", "health", "cycles", "fullModel", "buyDate", "price"].forEach(id => $(id).value = "");
  armed = false; $("toast").textContent = ""; $("importNote").hidden = true;
  client = null; $("clientData").hidden = true;
  applyLang();
};

if (TEST_MODE) { $("main").hidden = true; $("testMode").hidden = false; }
if (CLIENT_MODE) { $("cmPanel").hidden = false; $("tmTestsH").hidden = false; $("cmDone").hidden = false; }
$("model").value = st.model;
$("health").value = st.health;
$("cycles").value = st.cycles;
$("importNote").hidden = !imported;
applyLang();
</script>
